version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: telpro-monitor-app
    container_name: telpro_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      - APP_NAME="Telpro Project Monitor"
      - APP_ENV=production
      # IMPORTANT: Replace YOUR_APP_KEY_HERE with the APP_KEY from your .env file
      # It usually looks like base64:AbCdEfGhIjKlMnOpQrStUvWxYz1234567890=
      - APP_KEY=base64:53Qsq2w1JLjBFxV9/+N5W/gpIpViVXVy5gU6Mzflz8c=
      - APP_DEBUG=false
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=telpro_db
      - DB_USERNAME=telpro_user
      - DB_PASSWORD=telpro_secret
    depends_on:
      - db
    volumes:
      # These volumes keep your uploads and logs safe even if container restarts
      - ./storage/app/public:/var/www/html/storage/app/public
      - ./storage/logs:/var/www/html/storage/logs

  db:
    image: mysql:8.0
    container_name: telpro_db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=telpro_db
      - MYSQL_USER=telpro_user
      - MYSQL_PASSWORD=telpro_secret
      - MYSQL_ROOT_PASSWORD=telpro_root_secret
    ports:
      - "3306:3306"
    volumes:
      # This volume keeps your database data safe
      - telpro_db_data:/var/lib/mysql

volumes:
  telpro_db_data:
